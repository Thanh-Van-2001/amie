# Polymarket theme -> liquid external instrument(s) the signal should LEAD.
# The outcome variable of every validation test is the forward return of the
# mapped instrument, not the Polymarket token. Free hourly data: yfinance
# (equities/ETF proxies for futures) + Binance klines (crypto).
themes:
  fed_rates:
    match: [fed, fomc, "rate cut", "rate hike", powell]
    instruments: [TLT, SPY, UUP]        # rates -> bonds, equities, dollar
  inflation_macro:
    match: [cpi, inflation, gdp, recession, jobs, unemployment, payroll]
    instruments: [SPY, TLT, GLD]
  fiscal_politics:
    match: [shutdown, "debt ceiling", tariff, "trade deal", "trade war", election]
    instruments: [SPY, UUP, GLD]
  geopolitics_war:
    match: [war, ukraine, russia, iran, israel, taiwan, china, sanction, nuclear, strike]
    instruments: [USO, GLD, SPY]        # conflict -> oil, gold, risk-off
  energy:
    match: [oil, opec, "natural gas"]
    instruments: [USO, UNG]
  weather:
    match: [hurricane, storm, temperature, climate]
    instruments: [UNG, "corn: CORN"]
  earnings_single_stock:
    match: [earnings, nvidia, tesla, apple, microsoft, amazon, google, meta, openai]
    instruments: [BY_COMPANY]           # resolve to the named ticker
  crypto:
    match: [bitcoin, ethereum, etf, sec, solana]
    instruments: [BTCUSDT, ETHUSDT]     # Binance klines, true 24/7 futures

company_tickers:
  nvidia: NVDA
  tesla: TSLA
  apple: AAPL
  microsoft: MSFT
  amazon: AMZN
  google: GOOGL
  meta: META
  netflix: NFLX
